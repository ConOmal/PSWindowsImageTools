name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      real_image:
        description: 'Also run the integration suite against a real OS image captured from the runner (slow, ~1h)'
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/PSWindowsImageTools.csproj
        shell: pwsh

      - name: Build module
        run: dotnet build src/PSWindowsImageTools.csproj --no-restore --nologo
        shell: pwsh

      - name: Test
        run: >
          dotnet test tests/PSWindowsImageTools.Tests/PSWindowsImageTools.Tests.csproj
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
        shell: pwsh

      - name: Verify cmdlet help coverage
        run: |
          Import-Module ./Module/PSWindowsImageTools/PSWindowsImageTools.psd1 -Force
          $commands = Get-Command -Module PSWindowsImageTools
          $missing = $commands | Where-Object { -not (Get-Help $_.Name).Synopsis }
          if ($missing) {
            throw "Missing help for: $($missing.Name -join ', ')"
          }
          Write-Output "All $($commands.Count) cmdlets have help coverage"
        shell: pwsh

      - name: Verify help documentation sync
        run: |
          Install-Module platyPS -Scope CurrentUser -Force -AllowClobber
          ./Scripts/verify-help.ps1
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx
          if-no-files-found: warn

  integration:
    # Real DISM mount/save round-trips against a synthetic WIM. Runs on every
    # push to main and on manual dispatch; dev-branch pushes run unit tests only.
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build module
        run: |
          dotnet restore src/PSWindowsImageTools.csproj
          dotnet build src/PSWindowsImageTools.csproj --no-restore --nologo
        shell: pwsh

      - name: Sync fresh binary into the module
        run: Copy-Item Artifacts/bin/PSWindowsImageTools.dll Module/PSWindowsImageTools/bin/PSWindowsImageTools.dll -Force
        shell: pwsh

      - name: Ensure Pester 5
        run: |
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 } | Select-Object -First 1
          if (-not $pester) {
            Save-Module Pester -Path "$env:RUNNER_TEMP\pester" -RequiredVersion 5.7.1
            $pesterPath = Get-ChildItem "$env:RUNNER_TEMP\pester" -Recurse -Filter Pester.psd1 | Select-Object -First 1
            Import-Module $pesterPath.FullName -Force
          }
          else { Import-Module $pester.Path -Force }
          Write-Output "Pester $((Get-Module Pester).Version) ready"
        shell: pwsh

      - name: Run integration suite
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/integration'
          $cfg.Run.PassThru = $true
          $cfg.Filter.Tag = 'Integration'
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = './TestResults/integration-results.xml'
          $run = Invoke-Pester -Configuration $cfg
          exit [int]($run.FailedCount -gt 0)
        shell: pwsh

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: ./TestResults/integration-results.xml
          if-no-files-found: warn

  integration-real:
    # Full servicing surface: downloads a clean Windows 11 24H2 install.wim
    # (real CBS + driver store) as the baseline, exports the Pro edition named
    # to match the suite's expectations, and runs every integration test
    # against it. Manual dispatch only. The baseline is cached so repeat runs
    # skip the download/export. (Capturing the runner's own OS was abandoned:
    # the WIM alone was ~30-40 GB, exceeding both the runner's C: capacity and
    # the 10 GB actions/cache limit.)
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.real_image == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build module
        run: |
          dotnet restore src/PSWindowsImageTools.csproj
          dotnet build src/PSWindowsImageTools.csproj --no-restore --nologo
        shell: pwsh

      - name: Sync fresh binary into the module
        run: Copy-Item Artifacts/bin/PSWindowsImageTools.dll Module/PSWindowsImageTools/bin/PSWindowsImageTools.dll -Force
        shell: pwsh

      - name: Restore cached baseline WIM
        id: wim-cache
        uses: actions/cache@v4
        with:
          path: C:\PSWIT-real.wim
          key: pswit-baseline-wim-24h2-202510

      - name: Download Windows 11 24H2 ISO
        if: steps.wim-cache.outputs.cache-hit != 'true'
        run: |
          curl.exe -L --fail --retry 3 -o C:\Win11_24H2.iso "https://archive.org/download/win11_24h2_english_x64_202510/Win11_24H2_English_x64.iso"
          if ($LASTEXITCODE -ne 0) { throw "ISO download failed (exit $LASTEXITCODE)" }
          "ISO: {0:N2} GB" -f ((Get-Item C:\Win11_24H2.iso).Length / 1GB)
        shell: pwsh

      - name: Extract and export baseline WIM
        if: steps.wim-cache.outputs.cache-hit != 'true'
        run: |
          & "C:\Program Files\7-Zip\7z.exe" x C:\Win11_24H2.iso sources/install.wim -oC:\ -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed (exit $LASTEXITCODE)" }
          Import-Module ./Module/PSWindowsImageTools/PSWindowsImageTools.psd1 -Force
          $wim = Get-WindowsImageList -ImagePath C:\sources\install.wim
          $pos = [Array]::IndexOf([string[]]$wim.Name, 'Windows 11 Pro')
          if ($pos -lt 0) { throw "Windows 11 Pro index not found in install.wim" }
          $proIndex = $wim.Index[$pos]
          "Exporting index $proIndex -> C:\PSWIT-real.wim"
          dism /Export-Image /SourceImageFile:C:\sources\install.wim /SourceIndex:$proIndex /DestinationImageFile:C:\PSWIT-real.wim /DestinationName:"Windows 11 Pro IT" /Compress:max
          $exportExit = $LASTEXITCODE
          Remove-Item C:\Win11_24H2.iso, C:\sources -Recurse -Force -ErrorAction SilentlyContinue
          if ($exportExit -ne 0) {
            Copy-Item C:\Windows\Logs\DISM\dism.log ./dism-capture.log -ErrorAction SilentlyContinue
            throw "DISM export failed (exit $exportExit)"
          }
          "Baseline: {0:N2} GB" -f ((Get-Item C:\PSWIT-real.wim).Length / 1GB)
        shell: pwsh

      - name: Upload capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-diagnostics
          path: ./dism-capture.log
          if-no-files-found: ignore

      - name: Ensure Pester 5
        run: |
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 } | Select-Object -First 1
          if (-not $pester) {
            Save-Module Pester -Path "$env:RUNNER_TEMP\pester" -RequiredVersion 5.7.1
            $pesterPath = Get-ChildItem "$env:RUNNER_TEMP\pester" -Recurse -Filter Pester.psd1 | Select-Object -First 1
            Import-Module $pesterPath.FullName -Force
          }
          else { Import-Module $pester.Path -Force }
          Write-Output "Pester $((Get-Module Pester).Version) ready"
        shell: pwsh

      - name: Run integration suite against the real image
        env:
          PSWIT_IT_WIM: 'C:\PSWIT-real.wim'
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/integration'
          $cfg.Run.PassThru = $true
          $cfg.Filter.Tag = 'Integration'
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = './TestResults/integration-real-results.xml'
          $run = Invoke-Pester -Configuration $cfg
          exit [int]($run.FailedCount -gt 0)
        shell: pwsh

      - name: Upload real-image integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-real-results
          path: ./TestResults/integration-real-results.xml
          if-no-files-found: warn
